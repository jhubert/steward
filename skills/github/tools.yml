tools:
  - name: github
    description: >-
      Run GitHub CLI commands (everything after "gh"). This command string is
      parsed with POSIX shell-word-splitting only — it does NOT run through a
      real shell. Pipes (|), redirects (>, 2>&1), &&, and bash ANSI-C $'...'
      quoting are NOT supported and will be passed through as literal
      arguments, causing errors. Use plain 'single' or "double" quoted
      arguments only. For multi-line text (e.g. issue/PR bodies), put literal
      newline characters inside a quoted string rather than using $'...\n...'
      escapes. For --jq expressions that use jq string interpolation (e.g.
      "\(.field)"), wrap the whole --jq expression in single quotes so the
      double quotes survive word-splitting, e.g. --jq '.items[] |
      "\(.id) \(.name)"' — otherwise the inner double quotes are stripped
      as splitting and jq sees a bare \( token, which is a syntax error.
      There is no "merged" field for --json on pr view/list — use "state"
      (value "MERGED") or "mergedAt" instead.
    input_schema:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: "The gh subcommand to run (without the 'gh' prefix)"
    command_template: "ruby run.rb {command}"
    timeout_seconds: 30
