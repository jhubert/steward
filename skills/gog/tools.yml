tools:
  - name: gog
    description: >-
      Execute Google Workspace commands via the gog CLI. Pass the full command
      string (everything after "gog").

      Top-level commands: gmail, calendar, drive, docs, sheets, chat, contacts,
      tasks, people, groups, slides, keep, auth, config

      DOCS: docs create <title> [--parent FOLDER_ID] | docs cat <docId> | docs
      info <docId> | docs export <docId> [--format pdf|docx|txt] [--out PATH] |
      docs copy <docId> <title>

      DRIVE: drive ls [--parent FOLDER_ID] | drive search <query> | drive get
      <fileId> | drive download <fileId> | drive upload <localPath> [--parent
      FOLDER_ID] | drive mkdir <name> | drive share <fileId> --to user --role
      writer --email USER | drive url <fileId>

      SHEETS: sheets create <title> | sheets get <spreadsheetId> <range> | sheets
      update <spreadsheetId> <range> <values> | sheets append <spreadsheetId>
      <range> <values> | sheets metadata <spreadsheetId> | sheets export
      <spreadsheetId> [--format csv|xlsx|pdf]

      GMAIL: gmail search <query> [--limit N] | gmail get <messageId> (already
      returns the full message body by default — there is no --full flag on
      this subcommand) | gmail thread get <threadId> [--full] (--full is
      valid ONLY here, not on "gmail get") | gmail thread modify <threadId>
      [--add LABELS] [--remove LABELS] (use --remove UNREAD to mark read) |
      gmail drafts create --to ADDR --subject SUBJ | gmail labels list

      NOTE: gmail send / reply / forward / draft (singular) are blocked via
      this raw tool and will error. Use the gmail_reply (for replies) or
      gmail_new_thread (for new outbound mail) virtual tools instead — those
      validate recipients, threading, and content grounding.

      CALENDAR: calendar events [calendarId] [--from DATE --to DATE] | calendar
      create <calendarId> --summary TITLE --start DATETIME --end DATETIME |
      calendar freebusy <calendarIds> --from DATE --to DATE | calendar search
      <query>

      CHAT: chat spaces list | chat messages list <spaceId> | chat messages send
      <spaceId> --text MSG | chat dm send <userId> --text MSG

      Global flags: --json (JSON output), --plain (TSV output). Do NOT pass
      --account yourself — the correct account is injected automatically by
      the system, and specifying a different --account will select an
      unauthorized account and fail with an auth error.

      Use "<command> --help" to discover additional flags for any subcommand.

      IMPORTANT: this command string is parsed with POSIX shell-word-splitting
      only — it does NOT run through a real shell. Pipes (|), redirects (>,
      2>&1), &&, and bash ANSI-C $'...' quoting are NOT supported and will be
      passed through as literal arguments to gog, causing errors. Use plain
      'single' or "double" quoted arguments only. For multi-line text, put
      literal newline characters inside a quoted string rather than using
      $'...\n...' escapes.
    input_schema:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: 'The gog command to run (everything after "gog"), e.g. "gmail search in:inbox is:unread --limit 10"'
    command_template: "ruby scripts/run.rb {command}"
    timeout_seconds: 60
